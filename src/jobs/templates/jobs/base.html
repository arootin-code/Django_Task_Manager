{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Task Manager{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'jobs/vendor/bootstrap/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'jobs/css/app.css' %}">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/tasks-ui/">📋 Task Manager</a>
        <div class="ms-auto d-flex align-items-center gap-2">
            <span id="nav-username" class="text-light small"></span>
            <a href="/tasks-ui/" class="btn btn-outline-light btn-sm">Tasks</a>
            <button id="logout-btn" class="btn btn-outline-danger btn-sm">Logout</button>
        </div>
    </div>
</nav>

<main class="container pb-5">
    {% block content %}{% endblock %}
</main>

<script src="{% static 'jobs/vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
<script src="{% static 'jobs/js/auth.js' %}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
